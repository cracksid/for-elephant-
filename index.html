<style>

html[data-scene=ocean]{--bg1:#032a52;--bg2:#0a7a9c;--bg3:#8ff0dc;--castle:#04203d;--gold:#fff0b0}
html[data-scene=forest]{--bg1:#0b2a29;--bg2:#2f6b4f;--bg3:#d6ee8f;--castle:#0a1f1a;--gold:#ffe98a}
html,body{height:100%;margin:0;overflow:hidden}
html{background:radial-gradient(ellipse at 50% 35%,#2a1656 0%,#0d0628 55%,#050212 100%);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{position:relative;background:transparent;-webkit-tap-highlight-color:transparent;user-select:none}
/* intro screen */
#introOverlay{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#22144d 0%,#0c0624 50%,#03010d 100%);transition:opacity 1.4s cubic-bezier(.4,0,.2,1),visibility 1.4s cubic-bezier(.4,0,.2,1);overflow:hidden;cursor:pointer}

#introCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.intro-stage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:680px;padding:0 24px;text-align:center}
.castle-container{position:relative;width:min(84vw,360px);height:min(58vw,240px);margin-bottom:22px}
.castle-silhouette{position:absolute;inset:0;width:100%;height:100%;fill:#11092e;filter:drop-shadow(0 0 16px rgba(120,75,230,.6)) drop-shadow(0 0 35px rgba(255,215,100,.25));animation:castleGlow 4s ease-in-out infinite alternate}

.disney-arc-svg{position:absolute;top:-25%;left:-20%;width:140%;height:135%;overflow:visible;pointer-events:none}
.arc-track{fill:none;stroke:rgba(255,225,140,.15);stroke-width:1.5;stroke-dasharray:4 6}
.arc-glow{fill:none;stroke:url(#arcGoldGrad);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;animation:drawArc 3.6s cubic-bezier(.38,.04,.35,1) infinite;filter:drop-shadow(0 0 8px #ffea78) drop-shadow(0 0 18px #ffb300)}
@keyframes drawArc{0%{stroke-dashoffset:600;opacity:0}12%{opacity:1}72%{stroke-dashoffset:0;opacity:1}92%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:0;opacity:0}}
.star-head{offset-path:path("M 30,170 C 80,-40 280,-40 330,170");animation:moveStar 3.6s cubic-bezier(.38,.04,.35,1) infinite;transform-box:fill-box;transform-origin:center}

.intro-title-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.intro-sub{font-family:'Cinzel Decorative','Montserrat',serif;font-size:clamp(10px,2.5vw,13px);letter-spacing:.55em;text-transform:uppercase;color:#ffd875;margin-bottom:8px;opacity:.9;text-shadow:0 0 12px rgba(255,216,117,.6);animation:fadeInDown 1.5s ease-out both}
.intro-brand{font-family:'Great Vibes',cursive,serif;font-size:clamp(48px,12vw,84px);line-height:1.05;color:#fff8e1;background:linear-gradient(180deg,#fff 10%,#ffe99b 48%,#e2a837 88%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 25px rgba(255,215,100,.65)) drop-shadow(0 3px 6px rgba(0,0,0,.7));margin:0;animation:scaleGlow 2.5s ease-out both}

@keyframes fadeInDown{0%{opacity:0;transform:translateY(-10px)}100%{opacity:.9;transform:translateY(0)}}
.intro-tagline{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:clamp(17px,3.8vw,24px);color:#f7e7ff;margin:12px 0 28px;text-shadow:0 0 12px rgba(230,190,255,.4);letter-spacing:.04em}
.open-card-btn{display:inline-flex;align-items:center;gap:10px;padding:13px 32px;border-radius:999px;font-family:'Montserrat',sans-serif;font-size:14px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#1a0836;background:linear-gradient(135deg,#fff3c4 0%,#ffd86b 50%,#f6aa28 100%);border:1px solid rgba(255,245,200,.8);box-shadow:0 0 25px rgba(255,216,107,.55),0 8px 24px rgba(0,0,0,.4);cursor:pointer;transition:transform .25s cubic-bezier(.175,.885,.32,1.275),box-shadow .25s ease;animation:pulseBtn 2.4s ease-in-out infinite alternate}

.intro-hint{margin-top:14px;font-size:12px;color:rgba(255,245,230,.65);letter-spacing:.08em}
.replay-intro-btn{top:max(14px,1.5vh);left:14px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(20,10,60,.45);backdrop-filter:blur(6px);font-size:13px;color:var(--gold)}

#cv{position:absolute;inset:0;width:100%;height:100%}
#castle{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,780px);height:40vh;fill:var(--castle);overflow:visible}

#castle .lake{fill:var(--castle);fill:color-mix(in srgb,var(--castle) 55%,var(--bg2) 45%)}
#castle .rip{fill:none;stroke:var(--gold);stroke-width:.8;opacity:.3;stroke-dasharray:12 14;animation:rip 6s linear infinite}
#castle .tw{animation:tw 2.4s ease-in-out infinite}
#castle .dust{fill:none;stroke:#fff6c8;stroke-width:2.8;stroke-linecap:round;stroke-dasharray:.1 6.5;animation:dust 8s linear infinite,pulse 2.8s ease-in-out infinite;filter:drop-shadow(0 0 3px var(--gold))}

@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

@keyframes rise{from{opacity:0;transform:translateY(28px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
.a-bounce .w{opacity:0;animation:drop .9s cubic-bezier(.3,1.5,.5,1) forwards;animation-delay:calc(var(--i)*var(--step))}

.a-type .l{opacity:0;animation:show .01s forwards;animation-delay:calc(var(--i)*var(--step))}
@keyframes show{to{opacity:1}}
.still .w,.still .l{animation:none!important;opacity:1!important}
.from{margin-top:14px;font-family:"Great Vibes",cursive,serif;font-size:clamp(26px,5vw,38px);color:var(--gold);opacity:0;animation:fadein 1s 1.4s forwards}
@keyframes fadein{to{opacity:1}}

button{font:inherit;color:inherit;cursor:pointer}

.edit{top:max(14px,1.5vh);right:14px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(20,10,60,.45);backdrop-filter:blur(6px)}
.nav{left:0;right:0;bottom:14px;display:flex;justify-content:center;align-items:center;gap:6px}
.arrow{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(20,10,60,.5);font-size:24px;line-height:1}
.dots{display:flex;background:rgba(20,10,60,.5);border-radius:999px;padding:0 6px;border:1px solid var(--line)}
.dot{width:22px;height:30px;border:0;background:none;padding:0}
.dot::after{content:"";display:block;width:8px;height:8px;margin:auto;border-radius:50%;background:rgba(255,255,255,.4);transition:.25s}
.dot[aria-current=true]::after{background:var(--gold);transform:scale(1.5);box-shadow:0 0 10px var(--gold)}
.hint{left:0;right:0;bottom:70px;text-align:center;font-size:14px;color:var(--ink);opacity:.8;pointer-events:none;transition:opacity .5s;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.hint.gone{opacity:0}
.editing .hint,.editing .nav{opacity:0;pointer-events:none}
#panel{position:fixed;left:0;right:0;bottom:0;z-index:10;max-height:56vh;overflow:auto;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));background:var(--panel);backdrop-filter:blur(10px);border-top:1px solid var(--line);border-radius:22px 22px 0 0;color:var(--ink);transform:translateY(105%);visibility:hidden;transition:transform .35s ease,visibility .35s;user-select:text}
#panel.open{transform:none;visibility:visible}
#panel .in{max-width:640px;margin:auto;display:grid;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.head{justify-content:space-between;font-size:18px}
label,.grp>span{display:grid;gap:6px;font-size:14px;opacity:.95}
textarea,input{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);font:inherit;font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip,.btn{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:14px}
.chip[aria-pressed=true]{background:var(--gold);color:#2a1560;border-color:var(--gold)}
.btn.go{background:var(--gold);color:#2a1560;border-color:var(--gold);font-weight:600}
@media (prefers-reduced-motion:reduce){.w,.l{animation:none!important;opacity:1!important}.emb span,.from,.shoot,#castle .win,.arc-glow,.star-head{animation:none}.from{opacity:1}}
</style>
